server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keeps the browser on one origin in prod exactly like the Vite proxy does in dev, so
    # web/src/lib/api.ts can go on using relative /api paths and there is no CORS to configure.
    # api.<domain> still routes straight to the API through Traefik for anything non-browser.
    location /api/ {
        # Resolving through a variable defers the DNS lookup to request time. With a literal
        # hostname nginx resolves at startup and refuses to boot if the api container is not up
        # yet -- and never notices when its address changes on redeploy.
        resolver 127.0.0.11 valid=10s;

        # NOT `api`. traefik-public is shared with the StockScreener stack, whose own api service
        # holds that same alias, and Docker DNS round-robins across every container answering to a
        # name. This alias is set on the api service in docker-compose-prod.yml.
        set $api_upstream http://fantasytools-api:8080;

        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        # Card artwork uploads go through here. nginx defaults to 1m and answers anything larger with
        # its own 413 before the request reaches the API, so the browser sees a bare HTML error page
        # rather than the API's message. Kept just above the API's own 8 MB cap so that cap is the one
        # that actually reports.
        client_max_body_size 9m;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # This container's own healthcheck. The API's /health lives on the api container.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Which commit this image was built from -- baked in as /version.txt by web/Dockerfile. The api
    # container answers separately on /api/version; the two are tagged together but pull independently,
    # so they can disagree and that is worth being able to see.
    # Exact match: `location /` would hand a bare /version to try_files, which serves the extensionless
    # path as a download instead of text.
    location = /version {
        access_log off;
        add_header Cache-Control "no-store";
        try_files /version.txt =404;
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    # One directive, not `expires` plus add_header -- that combination emits two Cache-Control headers.
    location /assets/ {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    # index.html must not be cached, or a deploy leaves browsers pointing at deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # /login, /verify, /check-email are client-side routes -- they have no file on disk, and a
    # hard refresh or an emailed verification link lands on them directly.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
